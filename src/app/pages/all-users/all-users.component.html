<div class="container">
  <div class="header-container">
    <header></header>
    <h1>{{ "all-user-page.all-users" | translate }}</h1>
  </div>
  <app-sidebar></app-sidebar>
  <div>
    <kendo-grid
      [kendoGridBinding]="allUsers"
      [pageable]="true"
      [pageSize]="5"
      [sortable]="true"
    >
      <kendo-grid-column
        field="userName"
        [title]="'kendo-grid.userName' | translate"
      ></kendo-grid-column>
      <kendo-grid-column
        field="email"
        [title]="'kendo-grid.email' | translate"
      ></kendo-grid-column>
      <kendo-grid-column
        field="age"
        [title]="'kendo-grid.age' | translate"
      ></kendo-grid-column>
      <kendo-grid-column
        field="phoneNumber"
        [title]="'kendo-grid.phoneNumber' | translate"
      ></kendo-grid-column>
      <kendo-grid-column>
        <ng-template kendoGridCellTemplate let-dataItem>
          <!-- //The let-dataItem syntax allows you to access the current row's data.
          You can then pass dataItem directly to your onEditButtonClick method, -->
          <!-- which will contain the user data for that row. -->
          <button
            kendoButton
            themeColor="primary"
            fillMode="outline"
            (click)="onEditButtonClick(dataItem)"
          >
            {{ "all-user-page.edit" | translate }}
          </button>
        </ng-template>
      </kendo-grid-column>
    </kendo-grid>
  </div>
</div>
