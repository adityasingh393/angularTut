<div class="main-container">
  <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
    <div class="form-container">
      <label name="email">{{ "login-page.email" | translate }}</label>
      <input
        type="email"
        placeholder="Enter your email"
        formControlName="email"
        name="email"
      />
      <div
        style="color: red"
        *ngIf="
          loginForm.get('email')?.invalid && loginForm.get('email')?.touched
        "
      >
        <small *ngIf="loginForm.get('email')?.errors?.['required']"
          >Email is required.</small
        >
        <small *ngIf="loginForm.get('email')?.errors?.['email']"
          >Enter a valid email.</small
        >
      </div>
    </div>
    <div class="form-container">
      <label name="password">{{ "login-page.password" | translate }}</label>
      <input
        type="password"
        placeholder="Enter your password"
        name="password"
        formControlName="password"
      />
      <div
        style="color: red"
        *ngIf="
          loginForm.get('password')?.invalid &&
          loginForm.get('password')?.touched
        "
      >
        <small *ngIf="loginForm.get('password')?.errors?.['required']"
          >Password is required.</small
        >
        <small *ngIf="loginForm.get('password')?.errors?.['minlength']"
          >Password must be at least 6 characters.</small
        >
      </div>
    </div>

    <button kendoButton themeColor="primary" fillMode="solid" class="btn">
      {{ "login-page.login" | translate }}
    </button>
  </form>
  <div class="subContainer">
    <p>{{ "login-page.register-description" | translate }}</p>
    <button
      kendoButton
      themeColor="primary"
      fillMode="solid"
      class="btn"
      (click)="onClickRegister()"
    >
      {{ "login-page.register" | translate }}
    </button>
  </div>
</div>
