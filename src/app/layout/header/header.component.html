<div class="header-container row full-center">
  <nav class="nav-container">
    <a *ngIf="!authService.userLogged()" href="login">{{
      "header.Login" | translate
    }}</a>
    <a *ngIf="authService.userLogged() && authService.isAdmin()" href="admin">{{
      "header.admin_portal" | translate
    }}</a>
    <a href="upload-image">{{ "header.upload-image" | translate }}</a>

    <div class="select-container">
      <kendo-dropdownbutton
        [data]="languages"
        themeColor="secondary"
        fillMode="flat"
        [svgIcon]="languageIcon"
        (itemClick)="onChangeLanguage($event)"
      >
        <!-- i dont think [textField="'title'"] is needed but it was not working wihtout this (solved)-->
      </kendo-dropdownbutton>
      <div *ngIf="authService.userLogged()">
        <kendo-dropdownbutton
          [data]="dropDownButtonList"
          [textField]="'title'"
          [svgIcon]="profileIcon"
          themeColor="secondary"
          fillMode="flat"
          (itemClick)="onChangeOption($event)"
        >
          <!-- i dont think [textField="'title'"] is needed but it was not working wihtout this (solved)-->
        </kendo-dropdownbutton>
      </div>
    </div>
  </nav>
</div>
